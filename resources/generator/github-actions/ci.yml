# Needs a committed package-lock.json (run `npm install` once, then commit it): `npm ci` and the npm cache rely on it.
# Scripts that a module has not added yet are skipped (`--if-present`), so applying modules later needs no change here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run --if-present format:check
      - run: npm run typecheck
      - run: npm run --if-present webapp:typecheck
      - run: npm test
      - run: npm run --if-present server:build
      - run: npm run --if-present webapp:build
