name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:types
      - run: npm run test:coverage
      - run: npm run build

  generate:
    name: Full generated application
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Generates an application with all modules, then installs it, type-checks it, tests it and builds it,
      # and builds its Docker image and checks that the container answers.
      - run: npm run ci:generate
        env:
          CRAFTTYPE_DOCKER: '1'

  packed:
    name: Packed artifact
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # What users get: the tarball installed in an empty folder, outside the repository, then run through its `bin`.
      - name: Install the tarball and list the modules
        run: |
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP/$tarball"
          ./node_modules/.bin/crafttype list
      - name: Generate a complete application with the installed binary
        run: CRAFTTYPE_BIN="$RUNNER_TEMP/consumer/node_modules/.bin/crafttype" bash tests-ci/generate.sh
